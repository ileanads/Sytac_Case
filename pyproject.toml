[project]
name = "sytac-harvester"
version = "1.0.0"
description = "Real-time data harvester for Sytac video streaming events"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24.0",
    "httpx-sse>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
harvester = "harvester.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
